    <section class="features" style="padding-top: 150px; text-align: left;">
        <div class="container" style="max-width: 600px; margin: 0 auto;">
            <h1 style="color: var(--text-primary); margin-bottom: 1rem; text-align: center;">Contact Us</h1>
            <p style="text-align: center; color: var(--text-secondary); margin-bottom: 2rem;">Have a question about AruHome? Want to request a feature? Send us a message.</p>
            
            <form style="display: flex; flex-direction: column; gap: 15px; background: var(--bg-card); padding: 30px; border-radius: var(--radius-md); border: 1px solid var(--border);">
                <div>
                    <label style="color: var(--text-primary); display: block; margin-bottom: 5px;">Name</label>
                    <input type="text" style="width: 100%; padding: 10px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-elevated); color: var(--text-primary);" placeholder="Your Name">
                </div>
                <div>
                    <label style="color: var(--text-primary); display: block; margin-bottom: 5px;">Email</label>
                    <input type="email" style="width: 100%; padding: 10px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-elevated); color: var(--text-primary);" placeholder="Your Email">
                </div>
                <div>
                    <label style="color: var(--text-primary); display: block; margin-bottom: 5px;">Message</label>
                    <textarea rows="5" style="width: 100%; padding: 10px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-elevated); color: var(--text-primary);" placeholder="How can we help?"></textarea>
                </div>
                <button type="button" class="btn-pill btn-pill-primary" style="margin-top: 10px; text-align: center; justify-content: center;">Send Message</button>
            </form>
        </div>
    </section>
