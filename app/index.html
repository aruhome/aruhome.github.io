<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Open in AruHome</title>
    <meta name="description" content="Open this home asset in the AruHome app.">
    <style>
        :root {
            --green: #4CAF50;
            --text: #1b2a1f;
            --muted: #5d6b61;
            --bg: #f6f8f6;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        main {
            width: min(420px, 100%);
            background: #fff;
            border-radius: 20px;
            padding: 32px 24px;
            box-shadow: 0 12px 40px rgba(27, 42, 31, 0.08);
            text-align: center;
        }
        .mark {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            border-radius: 16px;
            background: var(--green);
            color: #fff;
            display: grid;
            place-items: center;
            font-size: 28px;
            font-weight: 700;
        }
        h1 { margin: 0 0 8px; font-size: 1.5rem; }
        p { margin: 0 0 12px; color: var(--muted); line-height: 1.5; }
        .id {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.9rem;
            color: var(--text);
            word-break: break-all;
        }
        .actions { display: grid; gap: 10px; margin-top: 24px; }
        a.button, button {
            appearance: none;
            border: 0;
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }
        .primary { background: var(--green); color: #fff; }
        .secondary { background: #e8f5e9; color: #1b5e20; }
        .note { margin-top: 20px; font-size: 0.85rem; }
    </style>
</head>
<body>
    <main>
        <div class="mark">A</div>
        <h1>Open in AruHome</h1>
        <p id="status">This label belongs to an item in your home library.</p>
        <p class="id" id="detail"></p>
        <div class="actions">
            <button class="primary" id="open" type="button">Open AruHome</button>
            <a class="secondary" href="https://apps.apple.com/search?term=AruHome">Get the app</a>
        </div>
        <p class="note">If nothing happens, open AruHome and scan the code from Assets.</p>
    </main>
    <script>
        const params = new URLSearchParams(window.location.search);
        const asset = params.get("asset");
        const task = params.get("task") || params.get("maintenance");

        function appURL() {
            if (asset) return "aruhome://asset/" + encodeURIComponent(asset);
            if (task) return "aruhome://maintenance/" + encodeURIComponent(task);
            return "aruhome://home";
        }

        const status = document.getElementById("status");
        const detail = document.getElementById("detail");
        if (asset) {
            status.textContent = "This QR opens an asset in AruHome.";
            detail.textContent = "Asset " + asset;
        } else if (task) {
            status.textContent = "This QR opens a maintenance task in AruHome.";
            detail.textContent = "Task " + task;
        } else {
            status.textContent = "Open AruHome to view your homes, assets, and tasks.";
        }

        function openApp() {
            window.location.href = appURL();
        }

        document.getElementById("open").addEventListener("click", openApp);
        window.setTimeout(openApp, 250);
    </script>
</body>
</html>
